name: roadwatch_app
description: RoadWatch AI — Intelligent Road Monitoring & Transparency Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3
  firebase_messaging: ^15.1.3

  # URL Launcher (officer navigation)
  url_launcher: ^6.3.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # HTTP Client
  dio: ^5.4.3+1

  # Secure Token Storage
  flutter_secure_storage: ^9.2.2

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Maps — OpenStreetMap (no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0

  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
